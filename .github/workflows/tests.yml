# Runs the tests on Linux and Windows for every push and Pull Request, so both systems give the same results, and
# scans the whole git history for secrets with gitleaks (live check 7).
name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks checks every commit, not only the last one
      # The plain CLI, not gitleaks-action: on pull_request the action calls the GitHub API for the PR's commits and
      # fails with "Resource not accessible by integration". This is also the exact command of live check 7.
      - name: gitleaks detect
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --verbose
