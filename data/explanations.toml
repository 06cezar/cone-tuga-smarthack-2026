[UNKNOWN_DEVICE.ro]
title = "Dispozitiv necunoscut în rețea"
text = "Dispozitivul de la {ip} nu își arată nici producătorul, nici numele, dar are cel puțin o „ușă” deschisă spre rețea. Poate fi un aparat de-al tău sau unul pe care nu îl cunoști."
steps = [
  "Deschide lista dispozitivelor conectate (în pagina routerului sau în setările hotspot-ului de pe telefon) și caută adresa {ip}.",
  "Oprește pe rând aparatele tale și scanează din nou, ca să afli care dintre ele este.",
  "Verifică telefoanele: cele noi își ascund adresa Wi-Fi reală (adresa MAC), așa că nu se vede producătorul.",
  "Dacă nu îl recunoști, schimbă parola Wi-Fi și reconectează doar aparatele tale.",
]

[UNKNOWN_DEVICE.en]
title = "Unknown device on the network"
text = "The device at {ip} shows neither its maker nor its name, but it has at least one \"door\" open to the network. It may be one of your gadgets, or one you don't know."
steps = [
  "Open the list of connected devices (in the router's page or in the hotspot settings on your phone) and look for the address {ip}.",
  "Turn off your gadgets one at a time and scan again, to find out which one it is.",
  "Check your phones: newer ones hide their real Wi-Fi address (MAC address), so the maker doesn't show.",
  "If you don't recognise it, change the Wi-Fi password and reconnect only your own gadgets.",
]

[SSH_OPEN]
references = ["CIS Controls v8.1 4.6", "CIS Controls v8.1 4.8"]

[SSH_OPEN.ro]
title = "Conectare de la distanță criptată (SSH), doar informativ"
text = "Dispozitivul de la {ip} permite conectare de la distanță prin SSH, care este criptată și, de obicei, sigură. Îți spunem doar ca să știi că există și să te asiguri că o protejează o parolă bună."
steps = [
  "Dacă nu te conectezi niciodată de la distanță la acest dispozitiv, poți opri SSH din setările lui.",
  "Dacă îl folosești, pune o parolă lungă sau, mai bine, o cheie de acces (cheie SSH) în loc de parolă.",
  "Instalează din când în când actualizările sistemului.",
]

[SSH_OPEN.en]
title = "Encrypted remote login (SSH), for your information"
text = "The device at {ip} allows remote login over SSH, which is encrypted and usually safe. We mention it only so you know it's there and make sure a good password protects it."
steps = [
  "If you never log in to this device remotely, you can turn SSH off in its settings.",
  "If you use it, set a long password or, better, an access key (SSH key) instead of a password.",
  "Install the system updates from time to time.",
]

