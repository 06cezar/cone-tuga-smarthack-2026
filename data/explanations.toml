[FTP_CLEARTEXT.ro]
title = "Transfer de fișiere necriptat (FTP)"
text = "Dispozitivul de la {ip} primește fișiere prin FTP, un mod vechi de a trimite fișiere în care parola și fișierele circulă necriptate. Cineva din aceeași rețea ar putea să le citească."
steps = [
  "Dacă nu folosești FTP, oprește-l din setările dispozitivului sau ale programului.",
  "Dacă ai nevoie să muți fișiere, alege în program varianta criptată, numită SFTP sau FTPS.",
  "Schimbă parola folosită pentru FTP, pentru că s-ar putea să fi fost văzută.",
  "În pagina routerului (aparatul care îți dă internetul), verifică să nu existe o „redirecționare de port” (port forwarding) pentru portul {port} (portul e „ușa” prin care se intră în dispozitiv).",
]

[FTP_CLEARTEXT.en]
title = "Unencrypted file transfer (FTP)"
text = "The device at {ip} accepts files over FTP, an old way of sending files where the password and the files travel unencrypted. Someone on the same network could read them."
steps = [
  "If you don't use FTP, turn it off in the device's or program's settings.",
  "If you need to move files, choose the encrypted option in the program, called SFTP or FTPS.",
  "Change the password used for FTP, because it may already have been seen.",
  "In the router's page (the box that gives you internet), check that there is no \"port forwarding\" for port {port} (a port is the \"door\" used to get into the device).",
]

[HTTP_ADMIN_CLEARTEXT]
references = ["CIS Controls v8.1 3.10", "CIS Controls v8.1 4.6", "OWASP IoT I7", "OWASP IoT I9"]

[HTTP_ADMIN_CLEARTEXT.ro]
title = "Pagină de administrare fără criptare"
text = "Pagina de administrare de la {ip} se deschide prin HTTP simplu, fără criptare, adică fără lacătul din browser. Când te conectezi, parola trece prin rețea în clar și cineva conectat ar putea s-o citească."
steps = [
  "În setările dispozitivului, caută o opțiune numită „HTTPS” sau „acces securizat” și activeaz-o.",
  "Oprește accesul prin HTTP simplu, dacă dispozitivul permite asta.",
  "Schimbă parola de administrare cu una lungă, pe care nu o mai folosești în altă parte.",
  "Oprește „administrarea de la distanță” (Remote Management), ca pagina să nu poată fi deschisă din internet.",
  "Actualizează programul din interiorul dispozitivului (firmware).",
]

[HTTP_ADMIN_CLEARTEXT.en]
title = "Admin page without encryption"
text = "The admin page at {ip} opens over plain HTTP, without encryption, meaning without the padlock in the browser. When you log in, the password crosses the network in plain text and someone connected could read it."
steps = [
  "In the device's settings, look for an option called \"HTTPS\" or \"secure access\" and turn it on.",
  "Turn off access over plain HTTP, if the device allows it.",
  "Change the admin password to a long one you don't use anywhere else.",
  "Turn off \"remote management\", so the page can't be opened from the internet.",
  "Update the software inside the device (firmware).",
]

[SMB_EXPOSED]
references = ["CIS Controls v8.1 3.3", "CIS Controls v8.1 4.8", "CIS Controls v8.1 7.3"]

[SMB_EXPOSED.ro]
title = "Fișiere partajate în rețea (SMB)"
text = "Dispozitivul de la {ip} partajează fișiere în rețea prin SMB, sistemul de foldere partajate din Windows. Dacă folderele nu au parolă sau sistemul nu e actualizat, alții pot citi fișierele sau pot răspândi viruși."
steps = [
  "Verifică ce foldere partajezi (în Windows: clic dreapta pe folder → Proprietăți → Partajare) și oprește partajarea celor de care nu ai nevoie.",
  "Oprește versiunea veche și periculoasă a SMB: pe un calculator Windows, deschide „Activare sau dezactivare caracteristici Windows” și debifează opțiunea care conține „SMB” și „CIFS”; pe un dispozitiv de stocare în rețea, caută „SMB1” în setări și dezactivează-l.",
  "Cere parolă pentru folderele care rămân partajate.",
  "Instalează toate actualizările sistemului (Windows Update sau actualizarea dispozitivului de stocare în rețea).",
  "În pagina routerului (aparatul care îți dă internetul), verifică să nu existe o „redirecționare de port” (port forwarding) pentru portul {port} (portul e „ușa” prin care se intră în dispozitiv).",
]

[SMB_EXPOSED.en]
title = "Files shared on the network (SMB)"
text = "The device at {ip} shares files on the network through SMB, the shared-folders system from Windows. If the folders have no password or the system isn't up to date, others can read the files or spread viruses."
steps = [
  "Check which folders you share (in Windows: right-click the folder → Properties → Sharing) and stop sharing the ones you don't need.",
  "Turn off the old, dangerous version of SMB: on a Windows computer, open \"Turn Windows features on or off\" and untick the option with \"SMB\" and \"CIFS\"; on a network storage box, look for \"SMB1\" in the settings and turn it off.",
  "Require a password for the folders that stay shared.",
  "Install every system update (Windows Update, or the update of your network storage box).",
  "In the router's page (the box that gives you internet), check that there is no \"port forwarding\" for port {port} (a port is the \"door\" used to get into the device).",
]

[MQTT_EXPOSED]
references = ["CIS Controls v8.1 3.10", "CIS Controls v8.1 4.8", "OWASP IoT I2"]

[MQTT_EXPOSED.ro]
title = "Mesageria dispozitivelor smart e deschisă (MQTT)"
text = "La {ip} rulează MQTT, un fel de poștaș prin care dispozitivele smart din casă își trimit mesaje și comenzi. Fără parolă, oricine din rețea poate citi mesajele sau poate trimite comenzi false, de exemplu să aprindă sau să stingă ceva."
steps = [
  "Deschide setările programului MQTT (de obicei în aplicația aparatului central care comandă casa smart) și oprește accesul fără parolă („anonymous”).",
  "Creează un utilizator cu parolă pentru fiecare dispozitiv care trimite mesaje.",
  "Dacă se poate, activează criptarea conexiunilor (opțiunea TLS).",
  "În firewall (paravanul de protecție), blochează portul {port} (portul e „ușa” prin care se intră în dispozitiv) pentru dispozitivele care nu au nevoie de el.",
]

[MQTT_EXPOSED.en]
title = "The smart devices' messaging is open (MQTT)"
text = "MQTT runs at {ip}, a kind of postman that smart home devices use to send each other messages and commands. Without a password, anyone on the network can read the messages or send fake commands, for example to turn something on or off."
steps = [
  "Open the MQTT program's settings (usually in the app of the central box that controls the smart home) and turn off access without a password (\"anonymous\").",
  "Create a user with a password for every device that sends messages.",
  "If you can, turn on encrypted connections (the TLS option).",
  "In the firewall (the protective barrier), block port {port} (a port is the \"door\" used to get into the device) for the devices that don't need it.",
]

[UPNP_EXPOSED]
references = ["CIS Controls v8.1 4.2", "CIS Controls v8.1 4.8", "OWASP IoT I9"]

[UPNP_EXPOSED.ro]
title = "Aparatele pot deschide singure „uși” spre internet (UPnP)"
text = "Dispozitivul de la {ip} folosește UPnP, o funcție prin care aparatele din casă pot cere routerului (aparatul care îți dă internetul) să le deschidă singur „uși” spre internet. Un aparat virusat ar putea astfel să devină accesibil din afară fără să știi."
steps = [
  "Dacă {ip} este routerul, intră în pagina lui cu parola de administrator, caută opțiunea „UPnP” (deseori în meniul Avansat) și oprește-o.",
  "Dacă {ip} este alt aparat (televizor, imprimantă, consolă), caută „UPnP” în setările lui și oprește-l dacă nu ai nevoie de el.",
  "Salvează setările și repornește aparatul.",
  "Dacă o aplicație sau o consolă de jocuri nu mai merge, deschide manual din router doar „ușa” (portul) de care are nevoie ea.",
]

[UPNP_EXPOSED.en]
title = "Devices can open \"doors\" to the internet by themselves (UPnP)"
text = "The device at {ip} uses UPnP, a feature that lets gadgets in the house ask the router (the box that gives you internet) to open \"doors\" to the internet for them. An infected gadget could use it to become reachable from outside without you knowing."
steps = [
  "If {ip} is the router, open its page with the admin password, find the \"UPnP\" option (often under Advanced) and turn it off.",
  "If {ip} is another gadget (TV, printer, console), look for \"UPnP\" in its settings and turn it off if you don't need it.",
  "Save the settings and restart the gadget.",
  "If an app or a game console stops working, open by hand, in the router, only the \"door\" (port) it needs.",
]

[SNMP_EXPOSED]
references = ["CIS Controls v8.1 4.6", "CIS Controls v8.1 4.7", "OWASP IoT I2", "OWASP IoT I9"]

[SNMP_EXPOSED.ro]
title = "Setările dispozitivului se pot citi din rețea (SNMP)"
text = "Dispozitivul de la {ip} răspunde la SNMP, o metodă prin care alte aparate îi pot citi și uneori schimba setările. Versiunile vechi folosesc „parole” simple, pe care le știe aproape oricine."
steps = [
  "Intră în setările dispozitivului și oprește SNMP, dacă nu îl folosești.",
  "Dacă îl folosești, treci la SNMPv3, varianta cu parolă și criptare.",
  "Schimbă parolele din fabrică (numite „community”, de obicei „public” și „private”) cu unele greu de ghicit.",
  "Actualizează programul din interiorul dispozitivului (firmware).",
]

[SNMP_EXPOSED.en]
title = "The device's settings can be read from the network (SNMP)"
text = "The device at {ip} answers SNMP, a way for other machines to read and sometimes change its settings. Old versions use simple \"passwords\" that almost everyone knows."
steps = [
  "Open the device's settings and turn SNMP off if you don't use it.",
  "If you use it, switch to SNMPv3, the version with a password and encryption.",
  "Change the factory passwords (called \"community\", usually \"public\" and \"private\") to ones that are hard to guess.",
  "Update the software inside the device (firmware).",
]

[PRINTER_RAW_EXPOSED]
