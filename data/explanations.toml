]

[PRINTER_RAW_EXPOSED.en]
title = "Anyone can send jobs to the printer"
text = "The printer at {ip} accepts print jobs directly, with no password at all. Anyone on the network can print on it or send it commands that change its settings."
steps = [
  "Open the printer's page (in a browser, at the address {ip}) and set an admin password, so nobody else can change its settings.",
  "Look in the printer's settings for a list of allowed computers (often called \"Access Control\" or \"IP Filter\") and keep only your own computers.",
  "Update the software inside the printer (firmware).",
  "Keep the printer only on your own network, not on the guest network.",
