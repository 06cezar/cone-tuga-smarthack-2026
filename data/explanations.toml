# Built-in explanations and fixes for every catalog code, in Romanian and English. Owner: stream B.
# Used when there's no LLM, or when an LLM answer fails the grounding check (conetuga/explain/CLAUDE.md).
#
# Format, per code:
#   references = CIS Controls v8.1 safeguards and OWASP IoT Top 10 (2018) items (bonus signal in the brief)
#   [CODE.ro] / [CODE.en]:
#     title = short label for the UI
#     text  = at most 2 sentences, about a 12-year-old's reading level; a technical word gets a plain explanation
#     steps = 1-5 ordered, concrete steps, most important first
#
# Placeholders: only values the scan gives us, filled in by code.
#   {ip}, {port}            from the finding (UNKNOWN_DEVICE has no {port})
#   {product}, {version}    from the host's port, used only by OUTDATED_SERVICE
# No number, address, version or CVE is written by hand: the text must stay true for every network. Product and
# feature names (Windows, Remote Desktop, JetDirect) appear only to help the user find the right setting.

[TELNET_OPEN]
references = ["CIS Controls v8.1 4.6", "CIS Controls v8.1 4.8", "CIS Controls v8.1 3.10", "OWASP IoT I2"]

[TELNET_OPEN.ro]
title = "Conectare de la distanță necriptată (Telnet)"
text = "Dispozitivul de la {ip} acceptă conectări de la distanță prin Telnet, o metodă veche care trimite parola necriptată, așa că cineva din rețea ar putea s-o citească. Cine află parola poate controla complet dispozitivul."
steps = [
  "Intră în setările dispozitivului (din aplicația lui sau din browser) și caută opțiunea „Telnet”.",
  "Oprește Telnet; dacă ai nevoie de acces de la distanță, folosește SSH, varianta criptată.",
  "Schimbă parola dispozitivului cu una lungă, pe care nu o mai folosești în altă parte.",
  "Instalează cea mai nouă versiune a programului din interiorul dispozitivului (firmware).",
  "Dacă nu poți opri Telnet, scoate dispozitivul din rețea până primești ajutor.",
]

[TELNET_OPEN.en]
title = "Unencrypted remote login (Telnet)"
text = "The device at {ip} accepts remote logins over Telnet, an old method that sends the password unencrypted, so someone on the network could read it. Whoever learns the password can fully control the device."
steps = [
  "Open the device's settings (in its app or in a browser) and look for the \"Telnet\" option.",
  "Turn Telnet off; if you need remote access, use SSH, the encrypted alternative.",
  "Change the device's password to a long one you don't use anywhere else.",
  "Install the newest version of the software inside the device (firmware).",
  "If you can't turn Telnet off, unplug the device from the network until you get help.",
]

[RDP_EXPOSED]
references = ["CIS Controls v8.1 4.5", "CIS Controls v8.1 4.8", "CIS Controls v8.1 7.3"]

[RDP_EXPOSED.ro]
title = "Control de la distanță al calculatorului (Remote Desktop)"
text = "Calculatorul de la {ip} poate fi controlat de pe alt calculator prin Remote Desktop, ca și cum cineva ar sta în fața lui. Dacă parola e slabă sau Windows nu e actualizat, un străin ar putea prelua calculatorul."
steps = [
  "Pe calculatorul respectiv, deschide Setări → Sistem → Desktop la distanță și oprește-l dacă nu îl folosești.",
  "Dacă îl folosești, lasă accesul doar pentru contul tău și pune-i o parolă lungă.",
  "Deschide Windows Update și instalează toate actualizările.",
  "În pagina routerului (aparatul care îți dă internetul), verifică să nu existe o „redirecționare de port” (port forwarding) pentru portul {port} (portul e „ușa” prin care se intră în dispozitiv), ca să nu se poată intra din internet.",
]

[RDP_EXPOSED.en]
title = "Remote control of the computer (Remote Desktop)"
text = "The computer at {ip} can be controlled from another computer through Remote Desktop, as if someone were sitting in front of it. If the password is weak or Windows isn't up to date, a stranger could take over the computer."
steps = [
  "On that computer, open Settings → System → Remote Desktop and turn it off if you don't use it.",
  "If you use it, allow access only for your own account and give it a long password.",
  "Open Windows Update and install every update.",
  "In the router's page (the box that gives you internet), check that there is no \"port forwarding\" for port {port} (a port is the \"door\" used to get into the device), so nobody can get in from the internet.",
]

[VNC_EXPOSED]
references = ["CIS Controls v8.1 4.5", "CIS Controls v8.1 4.8", "OWASP IoT I2"]

[VNC_EXPOSED.ro]
title = "Ecran partajat în rețea (VNC)"
text = "Dispozitivul de la {ip} își partajează ecranul prin VNC, deci cineva din rețea l-ar putea vedea și controla. Multe programe de acest fel au parole slabe sau trimit totul necriptat."
steps = [
  "Pe dispozitiv, închide programul de partajare a ecranului (VNC) și oprește-i pornirea automată.",
  "Dacă ai nevoie de el, pune o parolă lungă și permite conectări doar de pe calculatoarele care chiar au nevoie.",
  "Actualizează programul de partajare a ecranului la ultima versiune.",
  "În pagina routerului (aparatul care îți dă internetul), verifică să nu existe o „redirecționare de port” (port forwarding) pentru portul {port} (portul e „ușa” prin care se intră în dispozitiv).",
]

[VNC_EXPOSED.en]
title = "Screen shared on the network (VNC)"
text = "The device at {ip} shares its screen over VNC, so someone on the network could see and control it. Many programs like this have weak passwords or send everything unencrypted."
steps = [
  "On the device, close the screen-sharing program (VNC) and stop it from starting automatically.",
  "If you need it, set a long password and allow connections only from the computers that really need it.",
  "Update the screen-sharing program to its latest version.",
  "In the router's page (the box that gives you internet), check that there is no \"port forwarding\" for port {port} (a port is the \"door\" used to get into the device).",
]

[DB_EXPOSED]
references = ["CIS Controls v8.1 4.8", "CIS Controls v8.1 4.4", "CIS Controls v8.1 3.3", "OWASP IoT I2"]

[DB_EXPOSED.ro]
title = "Bază de date accesibilă din rețea"
text = "La {ip} există o bază de date (locul unde un program își păstrează informațiile) la care se poate conecta oricine din rețea. Dacă nu are parolă sau are una slabă, datele pot fi citite, schimbate sau șterse."
steps = [
  "Înainte de orice schimbare, fă o copie de siguranță a datelor.",
  "Află ce program folosește baza de date și dacă alte calculatoare chiar au nevoie de ea.",
  "Dacă o folosește doar calculatorul pe care stă, setează baza de date să accepte conectări doar de pe acel calculator.",
  "Pune o parolă puternică pentru fiecare utilizator al bazei de date.",
  "În firewall (paravanul de protecție al calculatorului), blochează portul {port} (portul e „ușa” prin care se intră în dispozitiv) pentru calculatoarele care nu au nevoie de el.",
]

[DB_EXPOSED.en]
title = "Database reachable from the network"
text = "There is a database at {ip} (the place where a program keeps its information) that anyone on the network can connect to. If it has no password or a weak one, the data can be read, changed or deleted."
steps = [
  "Before changing anything, make a backup copy of the data.",
  "Find out which program uses the database and whether other computers really need it.",
  "If only the computer it runs on uses it, set the database to accept connections only from that computer.",
  "Set a strong password for every database user.",
  "In the firewall (the computer's protective barrier), block port {port} (a port is the \"door\" used to get into the device) for the computers that don't need it.",
]

[CAMERA_STREAM_EXPOSED]
references = ["CIS Controls v8.1 4.7", "CIS Controls v8.1 4.8", "OWASP IoT I1", "OWASP IoT I9"]

[CAMERA_STREAM_EXPOSED.ro]
title = "Imaginea camerei se poate vedea din rețea"
text = "Camera de la {ip} transmite imaginea printr-un flux video (RTSP) pe care îl poate deschide oricine din rețea. Unele camere nu cer deloc parolă, așa că un străin ar putea vedea ce filmează camera."
steps = [
  "Intră în aplicația sau pagina camerei și schimbă parola din fabrică cu una lungă.",
  "Activează cererea de parolă pentru fluxul video (RTSP) sau oprește-l, dacă folosești doar aplicația camerei.",
  "Actualizează programul din interiorul camerei (firmware), din aplicație.",
  "În pagina routerului (aparatul care îți dă internetul), verifică să nu existe o „redirecționare de port” (port forwarding) pentru portul {port} (portul e „ușa” prin care se intră în dispozitiv).",
  "Dacă routerul are o rețea pentru oaspeți, poți muta camerele acolo; verifică apoi că aplicația camerei încă merge.",
]

[CAMERA_STREAM_EXPOSED.en]
title = "The camera's picture can be watched from the network"
text = "The camera at {ip} sends its picture through a video stream (RTSP) that anyone on the network can open. Some cameras don't ask for a password at all, so a stranger could see what the camera is filming."
steps = [
  "Open the camera's app or page and change the factory password to a long one.",
  "Turn on the password for the video stream (RTSP), or turn the stream off if you only use the camera's app.",
  "Update the software inside the camera (firmware) from the app.",
  "In the router's page (the box that gives you internet), check that there is no \"port forwarding\" for port {port} (a port is the \"door\" used to get into the device).",
  "If the router has a guest network, you can move the cameras there; then check that the camera's app still works.",
]

[OUTDATED_SERVICE]
references = ["CIS Controls v8.1 2.2", "CIS Controls v8.1 7.3", "CIS Controls v8.1 7.4", "OWASP IoT I5"]

[OUTDATED_SERVICE.ro]
title = "Program vechi, cu probleme cunoscute"
text = "Programul {product} {version} de la {ip} este o versiune veche, cu probleme de securitate cunoscute public. Pentru versiuni ca aceasta pot exista deja metode de atac gata făcute."
steps = [
  "Actualizează {product} la cea mai nouă versiune oferită de producător.",
  "Dacă programul nu mai primește actualizări, înlocuiește-l cu unul care încă e întreținut.",
  "Până la actualizare, oprește programul sau blochează-i portul {port} (portul e „ușa” prin care se intră în dispozitiv) în firewall (paravanul de protecție).",
  "După actualizare, scanează din nou rețeaua ca să vezi că problema a dispărut.",
]

[OUTDATED_SERVICE.en]
title = "Old software with known problems"
text = "The program {product} {version} at {ip} is an old version with publicly known security problems. Ready-made attack methods may already exist for versions like this one."
steps = [
  "Update {product} to the newest version from its maker.",
  "If the program no longer gets updates, replace it with one that is still maintained.",
  "Until it's updated, stop the program or block its port {port} (a port is the \"door\" used to get into the device) in the firewall (the protective barrier).",
  "After the update, scan the network again to check that the problem is gone.",
]

