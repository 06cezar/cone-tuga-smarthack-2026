# The threat wiki ("Wiki amenințări"): what each catalog code and a few basic network concepts mean, in Romanian and
# English. Owner: stream B. Used by conetuga/explain/wiki.py; the contract is "wiki_entries" in specs/contracts.md.
#
# These texts hold NO value from any scan and NO placeholder: no IP, port number, version or product name of a real
# network. The wiki is read without a scan, so every sentence must be true for every network.
#
# Format:
#   [simple.<id>.ro] / [simple.<id>.en]: what Tuga 🐢 says, for the 15 catalog codes and the 5 concepts
#     title = short label (for a code, the same as in data/explanations.toml)
#     text  = at most 3 sentences, no unexplained term, about a 12-year-old's reading level
#   [advanced.<id>.ro] / [advanced.<id>.en]: what Cone 🐇 says, ONLY for the 5 concepts (for the 15 codes, Cone's
#     title and text come from data/cone.toml)
#     title = short technical label
#     text  = at most 4 sentences; every technical term explained in a few words (NFR-09)
#   [related_codes]: for every id, the catalog codes the entry links to (the same in every language and mode);
#     valid catalog codes only, never the entry's own id, in catalog order, [] when none
#   <id> is a catalog code (e.g. TELNET_OPEN) or one of the concepts: port, encryption, firewall, mac, upnp.
# Romanian uses ș and ț with a comma below.

