  "Deschide Windows Update și instalează toate actualizările.",
  "În pagina routerului (aparatul care îți dă internetul), verifică să nu existe o „redirecționare de port” (port forwarding) pentru portul folosit de el (portul e „ușa” prin care se intră în dispozitiv), ca să nu se poată intra din internet.",
]
en = [
