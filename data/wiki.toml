  "In the router's page (the box that gives you internet), check that there is no \"port forwarding\" for the port it uses (a port is the \"door\" used to get into the device), so nobody can get in from the internet.",
]

[steps.VNC_EXPOSED]
ro = [
  "Pe dispozitiv, închide programul de partajare a ecranului (VNC) și oprește-i pornirea automată.",
  "Dacă ai nevoie de el, pune o parolă lungă și permite conectări doar de pe calculatoarele care chiar au nevoie.",
  "Actualizează programul de partajare a ecranului la ultima versiune.",
  "În pagina routerului (aparatul care îți dă internetul), verifică să nu existe o „redirecționare de port” (port forwarding) pentru portul folosit de el (portul e „ușa” prin care se intră în dispozitiv).",
]
